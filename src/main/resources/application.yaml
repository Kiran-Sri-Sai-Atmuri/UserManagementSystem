spring:
  application:
    name: UserManagementSystem
  datasource:
    url: jdbc:mysql://localhost:3306/projects
    username: root
    password: Kiran@333
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  shutdown: graceful

# -- Actuators --

management:
  endpoints:
    web:
      exposure:
        include: health,beans
  #        include: '*'
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: MyNewApp
    description: App built by Kiran
    version: 1.0.9
logging:
  level:
    com.kiran.UserManagementSystem: trace

